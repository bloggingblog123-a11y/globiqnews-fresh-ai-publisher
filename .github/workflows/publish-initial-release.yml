name: Publish initial plugin release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-initial-release.yml'

permissions:
  contents: read

concurrency:
  group: globiqnews-plugin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build installable ZIP
        id: build
        shell: bash
        run: |
          version="$(python3 tools/build_release.py)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag must match the version in the plugin header and readme.txt."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish packaged release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        shell: bash
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "This version already has a release. Increase the plugin version for the next update."
            exit 1
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --draft \
            --title "GlobiqNews Fresh AI Publisher $VERSION" \
            --notes-file RELEASE-NOTES.md \
            dist/globiqnews-fresh-ai-publisher.zip dist/SHA256SUMS.txt
          gh release edit "v$VERSION" --draft=false --latest
